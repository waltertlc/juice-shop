name: Supply Chain Security

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Install wkhtmltopdf for converting HTML to PDF
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      # Install Python dependencies for data parsing and PDF rendering
      - name: Install Python PDF Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdfkit

      # 1. Install dependencies so node_modules exists
      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # 2. Install Syft and Grype CLIs directly
      - name: Install Syft and Grype CLIs
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # 3. Force Syft to scan node_modules directly
      - name: Generate Full SBOM
        run: syft dir:./node_modules --exclude "" -o spdx-json=juiceshop.sbom.json

      # 4. Upload raw SBOM artifact
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-sbom
          path: juiceshop.sbom.json

      # 5. Scan SBOM with Grype and save as SARIF and JSON
      - name: Scan SBOM with Grype
        run: |
          grype sbom:juiceshop.sbom.json -o sarif > results.sarif || true
          grype sbom:juiceshop.sbom.json -o json > grype-results.json || true

      # 6. Parse JSON and generate formatted PDF Report
      - name: Generate Grype PDF Report
        run: |
          python -c '
          import json
          import pdfkit

          with open("grype-results.json") as f:
              data = json.load(f)

          rows = ""
          for item in data.get("matches", []):
              vuln = item.get("vulnerability", {})
              pkg = item.get("artifact", {})
              
              # Extract details
              cve_id = vuln.get("id", "N/A")
              
              # GHSA or alternate IDs
              related = vuln.get("relatedVulnerabilities", [])
              ghsa_id = related[0].get("id") if related else cve_id
              
              severity = vuln.get("severity", "Unknown")
              pkg_name = pkg.get("name", "N/A")
              installed_ver = pkg.get("version", "N/A")
              
              # Fix Version
              fix_versions = vuln.get("fix", {}).get("versions", [])
              fix_ver = ", ".join(fix_versions) if fix_versions else "None"
              
              # Severity color styling matching image
              sev_color = "#e67e22" if severity.lower() == "high" else "#e74c3c" if severity.lower() in ["critical"] else "#f1c40f" if severity.lower() == "medium" else "#2ecc71"

              rows += f"""
              <tr>
                  <td><b>{cve_id}</b></td>
                  <td>{ghsa_id}</td>
                  <td style="color: {sev_color}; font-weight: bold;">{severity}</td>
                  <td>{pkg_name}</td>
                  <td>{installed_ver}</td>
                  <td>{fix_ver}</td>
              </tr>
              """

          html_content = f"""
          <!DOCTYPE html>
          <html>
          <head>
              <style>
                  body {{ font-family: Arial, sans-serif; margin: 20px; }}
                  table {{ width: 100%; border-collapse: collapse; margin-top: 10px; }}
                  th {{ background-color: #f2f2f2; text-align: left; padding: 10px; border: 1px solid #ddd; font-weight: bold; }}
                  td {{ padding: 10px; border: 1px solid #ddd; font-size: 14px; }}
                  tr:nth-child(even) {{ background-color: #f9f9f9; }}
              </style>
          </head>
          <body>
              <h2>Vulnerability Report</h2>
              <table>
                  <thead>
                      <tr>
                          <th>CVE ID</th>
                          <th>GHSA / Original ID</th>
                          <th>Severity</th>
                          <th>Package</th>
                          <th>Installed Version</th>
                          <th>Fix Version</th>
                      </tr>
                  </thead>
                  <tbody>
                      {rows}
                  </tbody>
              </table>
          </body>
          </html>
          """

          with open("report.html", "w") as f:
              f.write(html_content)

          pdfkit.from_file("report.html", "grype-report.pdf")
          '

      # 7. Upload PDF Report Artifact
      - name: Upload PDF Vulnerability Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-vulnerability-report-pdf
          path: grype-report.pdf

      # 8. Upload SARIF results to GitHub Security tab
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: "grype-sbom"

# Install GuardDog via pip
      - name: Install GuardDog & jq
        run: |
          pip3 install guarddog
          sudo apt-get install -y jq

     # Parse package.json and run GuardDog scan on each package name
      - name: Run GuardDog Dependency Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Extracting dependencies from package.json..."
          DEPS=$(jq -r '(.dependencies // {}) + (.devDependencies // {}) | keys[]' package.json)
          
          if [ -z "$DEPS" ]; then
            echo "No dependencies found to scan."
            exit 0
          fi

          echo "Scanning dependencies with GuardDog..."
          for dep in $DEPS; do
            echo "----------------------------------------"
            echo "Scanning package: $dep"
            # Use 'scan' for remote npm registry packages
            guarddog npm scan "$dep" \
              --exclude-rules metadata_mismatch \
              --exclude-rules potentially_compromised_email_domain \
              --exclude-rules unclaimed_maintainer_email_domain || true
          done
        continue-on-error: true
